name: JD Normalization Service CI

on:
  pull_request:
    paths:
      - "services/jd-normalization-service/**"
      - ".github/workflows/jd-normalization-service-ci.yml"
      - "docs/work-reports/2026-07-28-java-jd-normalization-service-phase-1-work-report.md"
      - "docs/work-reports/2026-07-29-java-jd-normalization-service-phase-2a-postgresql-read-model-work-report.md"
      - "docs/work-reports/2026-07-29-java-jd-normalization-service-phase-2b-idempotent-create-work-report.md"
      - "docs/work-reports/2026-07-29-java-jd-normalization-service-phase-3a-conditional-update-work-report.md"
      - "docs/work-reports/2026-07-29-java-jd-normalization-service-phase-3b-containerization-work-report.md"
      - "docs/work-reports/2026-07-29-java-normalization-only-runtime-phase-1-work-report.md"
      - "docs/work-reports/README.md"
  push:
    branches: [main]
    paths:
      - "services/jd-normalization-service/**"
      - ".github/workflows/jd-normalization-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jd-normalization-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: services/jd-normalization-service
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/jd-normalization-service/pom.xml

      - name: Check patch whitespace
        working-directory: .
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base_sha="${PR_BASE_SHA:-${PUSH_BASE_SHA}}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi
          git diff --check "${base_sha}" "${GITHUB_SHA}"

      - name: Reject tracked build output
        working-directory: .
        run: |
          tracked_target="$(git ls-files 'services/jd-normalization-service/target/**')"
          if [[ -n "${tracked_target}" ]]; then
            printf '%s\n' "${tracked_target}"
            exit 1
          fi

      - name: Scan Java service for obvious secrets
        working-directory: .
        run: |
          credential_pattern='github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|JD_NORMALIZATION_(API_KEY|DB_PASSWORD|FLYWAY_PASSWORD)''=.+'
          if git grep -n -E "${credential_pattern}" -- \
            'services/jd-normalization-service/' \
            ':!services/jd-normalization-service/.env.example' \
            ':!services/jd-normalization-service/README.md'; then
            exit 1
          fi

      - name: Require Docker for PostgreSQL Testcontainers
        run: docker info >/dev/null

      - name: Verify Java service including PostgreSQL integration tests
        run: ./mvnw -B -ntp verify

      - name: Inspect runtime dependency tree
        run: |
          ./mvnw -B -ntp dependency:tree \
            -Dscope=runtime \
            -DoutputFile=target/runtime-dependency-tree.txt
          if grep -E '(^|:)h2:' target/runtime-dependency-tree.txt; then
            echo "H2 is not permitted."
            exit 1
          fi

      - name: Reject skipped PostgreSQL integration tests
        run: |
          report_count="$(find target/failsafe-reports -name 'TEST-*.xml' -type f | wc -l)"
          if [[ "${report_count}" -lt 7 ]]; then
            echo "Expected all PostgreSQL integration test reports."
            exit 1
          fi
          for report in \
            FlywaySchemaIT \
            PostgreSqlCreateApiIT \
            PostgreSqlIdempotencyConcurrencyIT \
            PostgreSqlReadApiIT \
            PostgreSqlUpdateApiIT \
            PostgreSqlUpdateConcurrencyIT \
            QueryPlanIT; do
            test -f "target/failsafe-reports/TEST-io.github.hkjokerz.jobagent.jdnormalization.integration.${report}.xml"
          done
          if grep -E 'skipped=\"[1-9][0-9]*\"' target/failsafe-reports/TEST-*.xml; then
            echo "PostgreSQL integration tests must not be skipped in CI."
            exit 1
          fi

      - name: Require normalization-only profile integration evidence
        run: |
          report="target/failsafe-reports/TEST-io.github.hkjokerz.jobagent.jdnormalization.NormalizationOnlyProfileIT.xml"
          test -f "${report}"
          if grep -E 'failures=\"[1-9][0-9]*\"|errors=\"[1-9][0-9]*\"|skipped=\"[1-9][0-9]*\"' "${report}"; then
            echo "Normalization-only integration tests must pass without skips."
            exit 1
          fi

      - name: Upload failed Surefire and Failsafe reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: jd-normalization-test-reports
          path: |
            services/jd-normalization-service/target/surefire-reports/
            services/jd-normalization-service/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: container-smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: services/jd-normalization-service
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Validate container definitions
        run: |
          bash -n scripts/container-smoke.sh
          bash -n scripts/normalization-only-container-smoke.sh
          bash -n scripts/generate-compose-env.sh
          sh -n docker/migrate-and-validate.sh
          sh -n docker/postgres-init.sh
          ./scripts/generate-compose-env.sh
          docker compose --env-file .env.compose config --quiet

      - name: Run isolated container smoke
        run: ./scripts/container-smoke.sh --ephemeral .env.compose

  normalization-only-container:
    name: normalization-only-no-database-smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: services/jd-normalization-service
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Validate focused smoke script
        run: |
          bash -n scripts/normalization-only-container-smoke.sh
          if grep -Eq 'docker (run|compose).*(postgres|migration)' \
            scripts/normalization-only-container-smoke.sh; then
            echo "The normalization-only smoke must not start database or migration containers."
            exit 1
          fi

      - name: Run normalization-only application without a database
        run: ./scripts/normalization-only-container-smoke.sh --ephemeral
