name: pja-java-normalization-candidate

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_DB: ${CANDIDATE_POSTGRES_DB:?candidate database is required}
      POSTGRES_USER: ${CANDIDATE_POSTGRES_USER:?candidate database user is required}
      POSTGRES_PASSWORD: ${CANDIDATE_POSTGRES_PASSWORD:?candidate database password is required}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      PGTZ: UTC
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --quiet --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    restart: "no"
    stop_grace_period: 20s
    shm_size: 128m
    mem_limit: 384m
    pids_limit: 192
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${CANDIDATE_BACKEND_IMAGE:?candidate backend image is required}
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://${CANDIDATE_POSTGRES_USER}:${CANDIDATE_POSTGRES_PASSWORD}@postgres:5432/${CANDIDATE_POSTGRES_DB}
      SESSION_COOKIE_SECURE: "false"
      AUTH_FINGERPRINT_KEY: ${CANDIDATE_AUTH_FINGERPRINT_KEY:?candidate fingerprint key is required}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${CANDIDATE_BACKEND_IMAGE:?candidate backend image is required}
    environment:
      APP_ENV: test
      APP_VERSION: "2.0.4"
      APP_DATABASE_PATH: /tmp/candidate-legacy-test.db
      TEST_DATABASE_URL: postgresql+psycopg://${CANDIDATE_POSTGRES_USER}:${CANDIDATE_POSTGRES_PASSWORD}@postgres:5432/${CANDIDATE_POSTGRES_DB}
      PROJECT_KNOWLEDGE_PATH: /app/seed/PROJECT_KNOWLEDGE.md
      PROJECT_KNOWLEDGE_SEED_PATH: /app/seed/PROJECT_KNOWLEDGE.md
      FILE_STORAGE_ROOT: /tmp
      SESSION_COOKIE_SECURE: "false"
      AUTH_ENABLED: "true"
      AUTH_TRUSTED_ORIGINS: http://127.0.0.1:${CANDIDATE_API_PORT}
      ALLOWED_ORIGINS: http://127.0.0.1:${CANDIDATE_API_PORT}
      TRUSTED_HOSTS: 127.0.0.1,localhost
      AUTH_FINGERPRINT_KEY: ${CANDIDATE_AUTH_FINGERPRINT_KEY:?candidate fingerprint key is required}
      ENABLE_API_DOCS: "true"
      MOCK_PROVIDER_ENABLED: "true"
      DEEPSEEK_API_KEY: ${CANDIDATE_MOCK_PROVIDER_KEY:?candidate mock key is required}
      MONITORING_ADMIN_TOKEN: ${CANDIDATE_MONITORING_TOKEN:?candidate monitoring token is required}
      READINESS_REQUIRE_REDIS: "false"
      READINESS_REQUIRE_WORKER: "false"
      MINIMUM_FREE_DISK_MB: "16"
      ANALYSIS_JD_NORMALIZATION_MODE: ${CANDIDATE_NORMALIZATION_MODE:-local}
      JD_NORMALIZATION_BASE_URL: ${CANDIDATE_JAVA_BASE_URL:-http://java-normalization:8080}
      JD_NORMALIZATION_API_KEY_FILE: /run/secrets/java_api_key
      JD_NORMALIZATION_CONNECT_TIMEOUT_MS: "250"
      JD_NORMALIZATION_RESPONSE_TIMEOUT_MS: "700"
      JD_NORMALIZATION_TOTAL_TIMEOUT_MS: "900"
      JD_NORMALIZATION_MAX_RESPONSE_BYTES: "262144"
      JD_NORMALIZATION_EXPECTED_POLICY_VERSION: jd-normalization-v1
      JD_NORMALIZATION_EXPECTED_DICTIONARY_VERSION: skills-v1
      JD_NORMALIZATION_SHADOW_SAMPLE_RATE: ${CANDIDATE_SHADOW_SAMPLE_RATE:-1}
      CANDIDATE_PROVIDER_BARRIER: ${CANDIDATE_PROVIDER_BARRIER:-0}
    secrets:
      - java_api_key
    command: ["uvicorn", "candidate.candidate_runtime:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${CANDIDATE_API_PORT}:8000
    networks:
      - edge
      - data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=96m,uid=10001,gid=10001
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 640m
    cpus: "1.00"
    pids_limit: 192
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()"]
      interval: 3s
      timeout: 4s
      retries: 30
      start_period: 8s

  java-normalization:
    image: ${CANDIDATE_JAVA_IMAGE:?candidate Java image is required}
    environment:
      SPRING_PROFILES_ACTIVE: normalization-only
      JD_NORMALIZATION_API_KEY: ${CANDIDATE_JAVA_API_KEY:?candidate Java key is required}
      JD_NORMALIZATION_BIND_ADDRESS: 0.0.0.0
      JD_NORMALIZATION_PORT: "8080"
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx256m
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
      TZ: UTC
    networks:
      - data
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.50"
    pids_limit: 128

  fault-stub:
    image: ${CANDIDATE_BACKEND_IMAGE:?candidate backend image is required}
    environment:
      CANDIDATE_FAULT_MODE: ${CANDIDATE_FAULT_MODE:-invalid_version}
    command: ["python", "/app/backend/candidate/fault_stub.py"]
    networks:
      - data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 96m
    cpus: "0.25"
    pids_limit: 48
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 2s

networks:
  edge:
  data:
    internal: true

volumes:
  postgres-data:

secrets:
  java_api_key:
    file: ${CANDIDATE_JAVA_KEY_FILE:?candidate Java key file is required}
