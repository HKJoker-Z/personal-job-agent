spring:
  application:
    name: jd-normalization-service
  main:
    banner-mode: "off"
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${JD_NORMALIZATION_JDBC_URL}
    username: ${JD_NORMALIZATION_DB_USERNAME}
    password: ${JD_NORMALIZATION_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    url: ${JD_NORMALIZATION_JDBC_URL}
    user: ${JD_NORMALIZATION_FLYWAY_USERNAME}
    password: ${JD_NORMALIZATION_FLYWAY_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  address: ${JD_NORMALIZATION_BIND_ADDRESS:127.0.0.1}
  port: ${JD_NORMALIZATION_PORT:8091}
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

jd-normalization:
  dictionary-resource: classpath:skills/skills-v1.json
  dictionary-max-entries: 256
  persistence:
    enabled: true
  schema-health:
    enabled: true
  security:
    api-key: ${JD_NORMALIZATION_API_KEY:}
    authentication-disabled: false

management:
  endpoints:
    web:
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,schemaReadiness
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  packages-to-scan: io.github.hkjokerz.jobagent.jdnormalization.web
  paths-to-match: /api/v1/job-descriptions/**
  swagger-ui:
    enabled: false

logging:
  level:
    com.zaxxer.hikari: "WARN"
    org.flywaydb.core: "WARN"
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.connections.pooling: "WARN"
    org.hibernate.orm.jdbc.bind: "OFF"
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: dev

jd-normalization:
  security:
    authentication-disabled: ${JD_NORMALIZATION_AUTH_DISABLED:false}
